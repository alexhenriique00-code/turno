<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipe · Turno</title>
<script src="https://jsdelivr.net"></script>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#2b6cb0;--act:#fff;--bd:#e2e2dd;--me:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--tx:#ececea;--mut:#9a9a94;--ac:#6aa8ee;--act:#10151c;--bd:#33332f;--me:#1e3a5f}}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--tx:#ececea;--mut:#9a9a94;--ac:#6aa8ee;--act:#10151c;--bd:#33332f;--me:#1e3a5f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--bd);background:var(--card)}
header button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--mut);font:600 15px inherit;font-family:inherit;cursor:pointer}
header button.on{background:var(--ac);color:var(--act)}
main{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 12px}
.msg.me{align-self:flex-end;background:var(--me)}
.meta{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}
.meta b{color:var(--tx)}
.txt{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.files{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.files img,.files video{max-width:100%;border-radius:10px;display:block}
.files a{color:var(--ac);word-break:break-all}
.del{margin-left:auto;background:none;border:0;color:var(--mut);font-size:12px;cursor:pointer}
.day{align-self:center;font-size:12px;color:var(--mut);margin-top:6px}
.empty,.warn{text-align:center;color:var(--mut);padding:30px 10px}
footer{border-top:1px solid var(--bd);background:var(--card);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;align-items:flex-end}
textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:9px 12px}
textarea{flex:1;resize:none;max-height:120px}
.ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.send{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--ac);color:var(--act);font:600 15px inherit;font-family:inherit;cursor:pointer}
.send:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px}
#kwpanel{padding:12px;background:var(--card);border-top:1px solid var(--bd);max-height:45%;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#kwpanel[hidden]{display:none}
#kwpanel .row{flex-wrap:wrap}
#kwpanel input{flex:1;min-width:120px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.kwrow{display:flex;align-items:center;gap:8px}
#nameModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
#nameModal[hidden]{display:none}
.modalBox{background:var(--card);padding:20px;border-radius:16px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--bd)}
.modalBox input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
</style></head>
<body>
<div id="nameModal" hidden>
  <div class="modalBox">
    <b>Como você quer ser identificado?</b>
    <span class="meta">Seu nome aparecerá nas mensagens e registros do turno.</span>
    <input id="userNameInput" placeholder="Ex: Alex Henrique">
    <button class="send" id="saveNameBtn">Entrar no Turno</button>
  </div>
</div>

<header>
  <button id="t-chat" class="on">💬 Conversa</button>
  <button id="t-turno">📋 Registro do turno</button>
  <button id="kwbtn" style="flex:0 0 auto" title="Palavras-chave">🔑</button>
  <button id="userbtn" style="flex:0 0 auto" title="Alterar nome">👤</button>
</header>
<main id="list"><div class="warn">Carregando…</div></main>
<div id="kwpanel" hidden></div>
<footer>
  <div id="chips" class="chips"></div>
  <div class="row" id="shiftrow" hidden>
    <select id="shift"><option>Manhã</option><option>Tarde</option><option>Noite</option></select>
  </div>
  <div class="row">
    <label class="ic" for="file">📎</label>
    <input id="file" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" hidden>
    <textarea id="txt" rows="1" placeholder="Escreva uma mensagem…"></textarea>
    <button class="send" id="send">Enviar</button>
  </div>
</footer>

<script>
const SUPABASE_URL = 'https://supabase.co';
const SUPABASE_KEY = 'sb_publishable_5IXoCCfKPgcuP_3nYI02_Q_4SPy7Jdq';

let sb = null;
let tab = 'chat', pending = [], data = {chat: [], turno: []}, kws = [];
let uid = localStorage.getItem('turno_uid') || ('u_' + Math.random().toString(36).slice(2, 10));
localStorage.setItem('turno_uid', uid);
let userName = localStorage.getItem('turno_name') || '';

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = t => new Date(t).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
const dayOf = t => new Date(t).toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long'});

function askName() {
  $('nameModal').hidden = false;
  $('userNameInput').value = userName;
}
$('userbtn').onclick = askName;
$('saveNameBtn').onclick = () => {
  const val = $('userNameInput').value.trim();
  if (!val) return;
  userName = val;
  localStorage.setItem('turno_name', userName);
  $('nameModal').hidden = true;
};

async function init() {
  if (!userName) askName();
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  await loadAll();

  sb.channel('db-changes')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'registros'}, () => loadRegistros())
    .on('postgres_changes', {event: '*', schema: 'public', table: 'keywords'}, () => loadKeywords())
    .subscribe();
}

async function loadAll() {
  await Promise.all([loadRegistros(), loadKeywords()]);
}

async function loadRegistros() {
  const {data: rows, error} = await sb.from('registros').select('*').order('t', {ascending: true}).limit(300);
  if (error) {
    $('list').replaceChildren(el('div', 'warn', 'Erro ao conectar com o Supabase: ' + error.message));
    return;
  }
  data.chat = rows.filter(r => r.tab === 'chat');
  data.turno = rows.filter(r => r.tab === 'turno');
  render();
}

async function loadKeywords() {
  const {data: rows} = await sb.from('keywords').select('*').order('id', {ascending: true});
  if (rows) { kws = rows; renderKw(); }
}

function render() {
  const list = data[tab];
  const box = $('list');
  const nodes = [];
  let lastDay = '';

  if (!list.length) {
    nodes.push(el('div', 'empty', tab === 'chat' ? 'Nenhuma mensagem ainda. Comece a conversa!' : 'Nenhum registro ainda. Anote o que foi produzido no turno.'));
  }

  list.forEach(m => {
    const d = dayOf(m.t);
    if (d !== lastDay) { nodes.push(el('div', 'day', d)); lastDay = d; }
    const b = el('div', 'msg' + (m.uid === uid ? ' me' : ''));
    const meta = el('div', 'meta');
    meta.append(el('b', null, m.author || 'Alguém'));
    if (m.shift) meta.append(el('span', null, '· ' + m.shift));
    meta.append(el('span', null, fmt(m.t)));

    if (m.uid === uid) {
      const x = el('button', 'del', 'apagar');
      x.onclick = async () => {
        if (x.dataset.s) {
          await sb.from('registros').delete().eq('id', m.id);
          loadRegistros();
        } else {
          x.dataset.s = 1;
          x.textContent = 'tocar p/ confirmar';
        }
      };
      meta.append(x);
    }
    b.append(meta);

    if (m.auto) {
      const a = el('div', 'txt', '✅ ' + m.action);
      a.style.fontWeight = '600';
      b.append(a);
      if (m.src) b.append(el('div', 'meta', 'mensagem: ' + m.src.slice(0, 80)));
    } else if (m.text) {
      b.append(el('div', 'txt', m.text));
    }

    if (m.files && m.files.length) {
      const f = el('div', 'files');
      m.files.forEach(a => {
        if ((a.type || '').startsWith('image/')) {
          const i = el('img'); i.src = a.url; i.loading = 'lazy'; i.alt = a.name || ''; f.append(i);
        } else if ((a.type || '').startsWith('video/')) {
          const v = el('video'); v.src = a.url; v.controls = true; v.preload = 'metadata'; v.playsInline = true; f.append(v);
        } else {
          const l = el('a', null, '📄 ' + (a.name || 'arquivo')); l.href = a.url; l.target = '_blank'; l.rel = 'noopener'; f.append(l);
        }
      });
      b.append(f);
    }
    nodes.push(b);
  });

  box.replaceChildren(...nodes);
  box.scrollTop = box.scrollHeight;
}

function chips() {
  const c = $('chips');
  c.replaceChildren(...pending.map((f, i) => {
    const x = el('span', 'chip', '✕ ' + f.name.slice(0, 24));
    x.onclick = () => { pending.splice(i, 1); chips(); };
    return x;
  }));
}
$('file').onchange = e => { pending.push(...e.target.files); e.target.value = ''; chips(); };
$('txt').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; };

$('send').onclick = async () => {
  const text = $('txt').value.trim();
